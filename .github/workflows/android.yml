name: android
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # Golden files compartidos con TypeScript (shared/fixtures/expected): misma salida en ambos núcleos.
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :testplayer:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/testplayer/build/outputs/apk/debug/*.apk
