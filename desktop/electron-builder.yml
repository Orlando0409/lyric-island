# Empaquetado: MSIX para Microsoft Store y NSIS para GitHub Releases.
appId: com.lyricisland.desktop
productName: LyricIsland
copyright: Copyright © 2026 OB Dev Studio
# Instalador lo más liviano posible: compresión máxima y solo los idiomas de la interfaz.
compression: maximum
electronLanguages:
  - es
  - es-419
  - en-US
# Herramientas modernas (Windows Kits 10.0.26100): el makeappx del juego legado no arranca en Windows 11 reciente.
toolsets:
  winCodeSign: 1.1.0
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/helper
    to: helper
    filter: ['*.exe']
  - from: resources/tray.png
    to: tray.png
win:
  icon: build/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  runAfterFinish: true
appx:
  # pnpm dist:store reemplaza la identidad con build/store-identity.json (local, no se sube).
  identityName: LyricIsland
  applicationId: LyricIsland
  displayName: LyricIsland
  publisherDisplayName: OB Dev Studio
  publisher: CN=00000000-0000-0000-0000-000000000000
  languages: [es-ES, en-US]
  # Autostart en MSIX: StartupTask propia (apagada por defecto; la de addAutoLaunchExtension arranca encendida).
  customExtensionsPath: build/appx/extensions.xml
  backgroundColor: '#1C1C1E'
  # El helper usa las APIs de medios de Windows 10 2004 (19041); probado en Windows 11 24H2.
  minVersion: 10.0.19041.0
  maxVersionTested: 10.0.26100.0
